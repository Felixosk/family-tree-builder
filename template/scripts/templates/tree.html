<script>
'use strict';
const D=__DATA__,PE=D.people,FA=D.fams,ME=D.media||{},BASE=D.base||'',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let root=PE[D.root]?D.root:Object.keys(PE)[0],selected=root,mode='tree',tab='family',depth=3,history=[],choices={},nodes=[],links=[],ghosts=[],arrows=[],genlabels=[],scale=1,tx=0,ty=0,bounds={w:1,h:1};

 parentPair=id=>{const f=parentFamily(id);return f?[PE[f.husb]?f.husb:null,PE[f.wife]?f.wife:null]:[null,null]},parents=id=>valid(parentPair(id)),children=id=>valid(families(id).flatMap(f=>f.chil)),partners=id=>valid(families(id).flatMap(f=>[f.husb,f.wife]).filter(k=>k!==id));

const SIL={M:'<svg viewBox="0 0 80 86" aria-hidden="true"><path d="M4 86c2-19 15-28 36-28s34 9 36 28z" fill="#34506a"/><rect x="33" y="44" width="14" height="16" rx="5" fill="#6d93b3"/><circle cx="40" cy="32" r="17" fill="#79a0bf"/><path d="M22 31c-1-13 8-21 19-21 12 0 19 8 18 19-4-6-12-9-22-8-7 1-12 4-15 10z" fill="#1f3346"/></svg>',F:'<svg viewBox="0 0 80 86" aria-hidden="true"><circle cx="56" cy="18" r="9" fill="#93432c"/><path d="M4 86c2-19 15-28 36-28s34 9 36 28z" fill="#b9604a"/><rect x="33" y="44" width="14" height="16" rx="5" fill="#d98d73"/><path d="M21 36c-3-16 6-27 19-27s22 11 19 27c-2 8-6 12-6 12H27s-4-4-6-12z" fill="#93432c"/><circle cx="40" cy="33" r="15" fill="#e29c80"/><path d="M25 30c2-10 9-15 17-15 8 0 13 5 14 12-8-1-17-4-22-9-2 5-5 9-9 12z" fill="#93432c"/></svg>',U:'<svg viewBox="0 0 80 86" aria-hidden="true"><path d="M4 86c2-19 15-28 36-28s34 9 36 28z" fill="#8d8d8d"/><rect x="33" y="44" width="14" height="16" rx="5" fill="#b3b3b3"/><circle cx="40" cy="32" r="17" fill="#b3b3b3"/></svg>'};
const pt=p=>{const s=p.sex==='F'?'F':p.sex==='M'?'M':'U';return `<span class="portrait ${s}">${p.photo&&ME[p.photo]&&!ME[p.photo].external?`<img src="${esc(BASE+ME[p.photo].file)}" alt="">`:SIL[s]}</span>`},yrs=p=>p.died?(p.born||'?')+'–'+p.died:(p.born||''),chev=t=>`<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${{'▲':'M2.5 7.5 6 4l3.5 3.5','▼':'M2.5 4.5 6 8l3.5-3.5','◂':'M7.5 2.5 4 6l3.5 3.5','▸':'M4.5 2.5 8 6l-3.5 3.5'}[t]}"/></svg>`;
$('#summary').textContent=`${Object.keys(PE).length} people · ${Object.keys(FA).length} families · ${Object.values(ME).filter(m=>!m.external).length} local documents`;
function initOpen(d){openUp.clear();openSib.clear();openDown.clear();(function walk(id,k){if(!id||k>=d||!hasParents(id))return;openUp.add(id);parentPair(id).forEach(p=>walk(p,k+1))})(root,0);if(children(root).length)openDown.add(root)}
/* ---------- Tree: root person at the bottom, ancestors above, siblings beside, children below ---------- */
const CW=132,CH=164,GX=28,GY=264,SG=24;
function sibList(id){return openSib.has(id)?siblings(id):[]}
function upW(id){ // width of the subtree above, including own card and sibling row
 const sibW=sibList(id).length?(sibList(id).length*(CW+SG)):0;
 let L=CW/2,R=CW/2+(sibW?SG+sibW:0);
 if(openUp.has(id)&&hasParents(id)){const[f,m]=parentPair(id);const pw=upW2(f)+GX+upW2(m);L=Math.max(L,pw/2);R=Math.max(R,pw/2)}
 return {L,R,w:L+R}}
function upW2(id){return id?upW(id).w:CW}
function placeUp(id,x0,y,gen){ // returns the card centre x
 const {L}=upW(id);const cx=x0+L;nodes.push({id,x:cx-CW/2,y,role:gen===0?'Root person':gen===1?'Parents':gen===2?'Grandparents':gen===3?'Great-grandparents':(gen-2)+'× great-grandparents'});
 const sibs=sibList(id);sibs.forEach((s,i)=>{const sx=cx+CW/2+SG+i*(CW+SG);nodes.push({id:s.id,x:sx,y,role:s.kind,sib:true});links.push({type:'sib',x1:cx+CW/2,x2:sx,y:y+CH/2})});
 if(siblings(id).length)arrows.push({x:cx+CW/2-6,y:y+CH/2-12,t:openSib.has(id)?'◂':'▸',act:'sib',id,title:openSib.has(id)?'Hide siblings':`${siblings(id).length} siblings: show`});
 if(hasParents(id)){arrows.push({x:cx-12,y:y-30,t:openUp.has(id)?'▼':'▲',act:'up',id,title:openUp.has(id)?'Collapse ancestors':'Show parents'});
  if(openUp.has(id)){const[f,m]=parentPair(id);const wf=upW2(f),wm=upW2(m),px=cx-(wf+GX+wm)/2,py=y-GY;
   const cf=f?placeUp(f,px,py,gen+1):(ghosts.push({x:px+wf/2-CW/2,y:py,t:'Father unknown'}),px+wf/2);
   const cm=m?placeUp(m,px+wf+GX,py,gen+1):(ghosts.push({x:px+wf+GX+wm/2-CW/2,y:py,t:'Mother unknown'}),px+wf+GX+wm/2);
   links.push({type:'par',cx,y,cf,cm,py});genlabels.push({x:(cf+cm)/2,y:py+CH+40,t:gen===0?'Parents':gen===1?'Grandparents':gen===2?'Great-grandparents':(gen-1)+'× great-grandparents'})}}
 return cx}
function downW(id){if(!openDown.has(id))return CW;const ch=children(id);return ch.length?ch.reduce((a,c)=>a+downW(c),0)+GX*(ch.length-1):CW}
function placeDown(id,cx,y,gen){ // children below an already placed card
 const ch=children(id);if(!ch.length)return;
 arrows.push({x:cx-12,y:y+CH+6,t:openDown.has(id)?'▲':'▼',act:'down',id,title:openDown.has(id)?'Collapse children':`${ch.length} children: show`});
 if(!openDown.has(id))return;
 const tot=downW(id);let x=cx-tot/2;const cy=y+GY;const cxs=[];
 ch.forEach(c=>{const w=downW(c),ccx=x+w/2;nodes.push({id:c,x:ccx-CW/2,y:cy,role:gen===0?'Child':gen===1?'Grandchild':'Descendant'});cxs.push(ccx);placeDown(c,ccx,cy,gen+1);x+=w+GX});

function layoutTree(){nodes=[];links=[];ghosts=[];arrows=[];genlabels=[];
 const {L,R}=upW(root);const dw=downW(root);const left=Math.max(L,dw/2),right=Math.max(R,dw/2);
 // partner of the root person to the right, after the siblings
 const ps=partners(root);const sibW=sibList(root).length*(CW+SG);const partnerX0=left+CW/2+(sibW?SG+sibW:0)+GX*2;

 const cx=placeUp(root,40+left-L,0,0);
 ps.forEach((p,i)=>{const px=40+partnerX0+i*(CW+SG);nodes.push({id:p,x:px,y:0,role:'Partner'});links.push({type:'partner',x1:cx+CW/2+(sibW?SG+sibW:0),x2:px,y:CH/2})});
 placeDown(root,cx,0,0);
 const minY=Math.min(0,...nodes.map(n=>n.y),...ghosts.map(g=>g.y)),maxY=Math.max(CH,...nodes.map(n=>n.y+CH));const offY=-minY+40;
 nodes.forEach(n=>n.y+=offY);ghosts.forEach(g=>g.y+=offY);arrows.forEach(a=>a.y+=offY);genlabels.forEach(g=>g.y+=offY);
 links.forEach(l=>{if(l.type==='par'){l.y+=offY;l.py+=offY}else if(l.type==='kids'){l.y+=offY;l.cy+=offY}else l.y+=offY});
 bounds={w:totalW,h:maxY-minY+80}}
/* ---------- Descendants view (row layout) ---------- */
function layoutDescendants(){nodes=[];links=[];ghosts=[];arrows=[];genlabels=[];const seen=new Map(),rows=new Map();
 function add(id,g,role){if(!PE[id])return null;if(seen.has(id))return seen.get(id);const n={id,g,role,x:0,y:0};seen.set(id,n);if(!rows.has(g))rows.set(g,[]);rows.get(g).push(n);nodes.push(n);return n}
 function edge(a,b,type='child'){if(a&&b&&a!==b&&!links.some(l=>l.a===a&&l.b===b&&l.type===type))links.push({a,b,type})}
 add(root,0,'Root person');
 (function down(id,g,d,path){if(d===0||path.has(id))return;const next=new Set(path).add(id);families(id).forEach(f=>{const spouse=[f.husb,f.wife].find(k=>k&&k!==id);const sp=add(spouse,g,'Partner');edge(seen.get(id),sp,'partner');f.chil.forEach(cid=>{const c=add(cid,g+1,g===0?'Children':g===1?'Grandchildren':'Descendants');edge(seen.get(id),c);edge(sp,c);down(cid,g+1,d-1,next)})})})(root,0,depth,new Set());
 const max=Math.max(...[...rows.values()].map(r=>r.length));bounds={w:max*(CW+32)+80,h:rows.size*(CH+80)+60};
 [...rows.entries()].sort((a,b)=>a[0]-b[0]).forEach(([g,row])=>{if(g!==0){row.sort((a,b)=>{const score=n=>{const ps=links.filter(l=>l.b===n&&l.type==='child').map(l=>l.a.x);return ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:bounds.w/2};return score(a)-score(b)})}row.forEach((n,i)=>{n.x=(bounds.w-row.length*(CW+32))/2+i*(CW+32)+16;n.y=g*(CH+80)+40})})}
function render(){if(mode==='list'){renderDirectory();return}$('#directory').hidden=true;if(mode==='tree')layoutTree();else layoutDescendants();
 $('#world').style.width=bounds.w+'px';$('#world').style.height=bounds.h+'px';
 let h=nodes.map(n=>{const p=PE[n.id];const docs=p.media.length;return `<button class="card ${n.id===root?'root':''} ${n.id===selected?'selected':''} ${n.sib?'sib':''}" style="left:${n.x}px;top:${n.y}px" data-person="${esc(n.id)}" title="${esc(p.name)} · ${esc(n.role)} · open profile"><i class="source-dot ${p.cls}" title="${labels[p.cls]}"></i>${docs?`<i class="doc-dot" title="${docs} documents">📎${docs}</i>`:''}${pt(p)}<span class="txt"><span class="name">${esc(p.name)}</span><small>${esc(yrs(p))}</small></span>${parentFamilies(n.id).length>1?'<i class="flag" title="Several parent families, choose in the profile">⚠</i>':''}</button>`}).join('');
 h+=ghosts.map(g=>`<div class="ghost" style="left:${g.x}px;top:${g.y}px">${g.t}</div>`).join('');
 h+=arrows.map(a=>`<button class="arrow" style="left:${a.x}px;top:${a.y}px" data-act="${a.act}" data-id="${esc(a.id)}" title="${esc(a.title)}" aria-label="${esc(a.title)}">${chev(a.t)}</button>`).join('');
 h+=genlabels.map(g=>`<span class="genlabel" style="left:${g.x}px;top:${g.y}px">${esc(g.t)}</span>`).join('');
 $('#nodes').innerHTML=h;
 const E=$('#edges');E.setAttribute('width',bounds.w);E.setAttribute('height',bounds.h);E.setAttribute('fill','none');E.setAttribute('stroke-width','1.5');
 E.innerHTML=links.map(l=>{if(l.type==='par'){const ym=l.py+CH+28;return `<path d="M${l.cx},${l.y} V${ym} M${l.cf},${l.py+CH} V${ym} H${l.cm} V${l.py+CH}" stroke="#a8a8a8"/>`}
  if(l.type==='kids'){const ym=l.y+40;return `<path d="M${l.cx},${l.y} V${ym} M${Math.min(...l.cxs,l.cx)},${ym} H${Math.max(...l.cxs,l.cx)} ${l.cxs.map(x=>`M${x},${ym} V${l.cy}`).join(' ')}" stroke="#a8a8a8"/>`}
  if(l.type==='sib')return `<path d="M${l.x1},${l.y} H${l.x2}" stroke="#8e8e8e" stroke-dasharray="3 3"/>`;
  if(l.type==='partner'&&l.x1!==undefined)return `<path d="M${l.x1},${l.y} H${l.x2}" stroke="#b4b4b4" stroke-dasharray="4 3"/>`;
  const x=l.a.x+CW/2,y=l.a.y+CH,xx=l.b.x+CW/2,yy=l.b.y;return l.type==='partner'?`<path d="M${x},${l.a.y+CH/2} H${xx}" stroke="#b4b4b4" stroke-dasharray="4 3"/>`:`<path d="M${x},${y} V${(y+yy)/2} H${xx} V${yy}" stroke="#a8a8a8"/>`}).join('');
 $('#status').textContent=`${PE[root].name} · ${nodes.length} people in this view${parentFamilies(root).length>1?' · parent family selectable in the profile':''}`;apply();$('#back').disabled=!history.length}
function apply(){$('#world').style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;$('#zoom').textContent=Math.round(scale*100)+' %'}
function fit(){const r=$('#stage').getBoundingClientRect();scale=Math.min(1.15,(r.width-48)/bounds.w,(r.height-120)/bounds.h);scale=Math.max(.03,scale);tx=(r.width-bounds.w*scale)/2;ty=(r.height-bounds.h*scale)/2;apply()}
function centerOn(id){const n=nodes.find(n=>n.id===id);if(!n)return;const r=$('#stage').getBoundingClientRect();tx=r.width/2-(n.x+CW/2)*scale;ty=r.height/2-(n.y+CH/2)*scale;apply()}
function zoom(k){const r=$('#stage').getBoundingClientRect();zoomAt(k,r.width/2,r.height/2)}function zoomAt(k,x,y){const next=Math.min(2.5,Math.max(.03,scale*k));tx=x-(x-tx)*next/scale;ty=y-(y-ty)*next/scale;scale=next;apply()}
function navigate(id,push=true){if(!PE[id])return;if(push&&id!==root)history.push(root);root=id;selected=id;$('#hits').hidden=true;if(mode==='list')setMode('tree',false);initOpen(depth);render();show(id);fit()}
function relative(id,detail=''){const p=PE[id];return p?`<button class="relative" data-go="${esc(id)}">${av(p)}<span><b>${esc(p.name)}</b><small>${esc(years(p))}${detail?' · '+esc(detail):''}</small></span></button>`:''}
function citation(q){return `<div class="citation"><b>${esc(q.title)}</b>${esc(q.page)}${q.quay?' · quality '+esc(q.quay)+'/3':''}</div>`}
function mediaCard(mid){const m=ME[mid];if(!m)return '';if(m.external)return `<div class="media-ext"><b>${esc(m.title||'Medium')}</b>${m.date?' · '+esc(m.date):''}<br>Stored at Ancestry, file not available locally.</div>`;
 const src=BASE+m.file;return `<button data-lb="${esc(mid)}">${m.isImage?`<img src="${esc(src)}" alt="">`:`<div style="height:120px;display:grid;place-items:center;font-size:32px">📄</div>`}<span class="cap"><b>${esc(m.title||m.file)}</b>${esc([m.date,m.place].filter(Boolean).join(' · '))}</span></button>`}
function thumbs(ids){const loc=ids.filter(x=>ME[x]&&!ME[x].external&&ME[x].isImage);return loc.length?`<div class="thumbs">${loc.map(x=>`<button data-lb="${esc(x)}" title="${esc(ME[x].title)}"><img src="${esc(BASE+ME[x].file)}" alt=""></button>`).join('')}</div>`:''}
function show(id){if(!PE[id])return;selected=id;const p=PE[id];$('#panel').hidden=false;let body='';
 if(tab==='family'){const pf=parentFamilies(id);body+='<h3>Parents</h3>';if(pf.length>1)body+=`<div class="notice">${pf.length} parent families are stored. This is not an automatically resolved descent.<br><select id="parent-choice" aria-label="Choose parent family">${pf.map((fid,i)=>`<option value="${esc(fid)}" ${(choices[id]||pf[0])===fid?'selected':''}>${i+1}: ${esc(valid([FA[fid].husb,FA[fid].wife]).map(k=>PE[k].name).join(' + ')||'Unknown')}</option>`).join('')}</select></div>`;body+=parents(id).map(k=>relative(k)).join('')||'<p class="muted">No parents recorded.</p>';const sib=siblings(id);body+=`<h3>Siblings (${sib.length})</h3>`+(sib.map(s=>relative(s.id,s.kind)).join('')||'<p class="muted">No siblings recorded.</p>');body+='<h3>Partners and children</h3>';body+=families(id).map(f=>{const sp=[f.husb,f.wife].find(k=>k&&k!==id);return (sp?relative(sp,'Partner'):'<p class="muted">Partner unknown</p>')+f.marr.map(e=>`<p class="muted">Marriage · ${esc(e.date)} ${esc(e.place)}</p>`).join('')+valid(f.chil).map(c=>relative(c,'Child')).join('')}).join('')||'<p class="muted">No partners or children recorded.</p>';const gc=valid(children(id).flatMap(children));body+=`<h3>Grandchildren (${gc.length})</h3>`+(gc.map(k=>relative(k)).join('')||'<p class="muted">No grandchildren recorded.</p>')}
 if(tab==='life'){body='<h3>Life events</h3>';const events=[...p.events,...families(id).flatMap(f=>f.marr)].sort((a,b)=>Number(a.date.match(/\d{4}/)?.[0]||9999)-Number(b.date.match(/\d{4}/)?.[0]||9999));body+=events.map(e=>`<div class="event"><small class="muted">${esc(e.date||'Date unknown')}</small><b>${esc(eventNames[e.tag]||e.tag)}${e.type?' · '+esc(e.type):''}</b>${esc(e.place)}${e.notes.map(n=>`<div class="note">${esc(n)}</div>`).join('')}${thumbs(e.media||[])}${e.sources.length?`<details><summary class="muted">${e.sources.length} citations</summary>${e.sources.map(citation).join('')}</details>`:''}</div>`).join('')||'<p class="muted">No events recorded.</p>';body+='<h3>Name forms</h3>'+p.names.map(n=>`<p>${esc(n.name)} <small>${esc(n.type)}</small>${n.sources.map(citation).join('')}</p>`).join('')+'<h3>Research notes</h3>'+(p.notes.map(n=>`<div class="note">${esc(n)}</div>`).join('')||'<p class="muted">No notes recorded.</p>')}
 if(tab==='media'){const loc=p.media.filter(x=>ME[x]&&!ME[x].external),ext=p.media.filter(x=>ME[x]&&ME[x].external);body=`<h3>Documents and photos (${loc.length})</h3>`+(loc.length?`<div class="media">${loc.map(mediaCard).join('')}</div>`:'<p class="muted">No local documents yet. Put files in sources/ and list them in sources/media.tsv.</p>');if(ext.length)body+=`<h3>Bei Ancestry hinterlegt (${ext.length})</h3>`+ext.map(mediaCard).join('')}
 if(tab==='sources'){const unique=[...new Map([...p.sources,...families(id).flatMap(f=>f.marr.flatMap(e=>e.sources))].map(q=>[q.id+'|'+q.page,q])).values()];body=`<h3>Sources (${unique.length})</h3><div class="notice">A source does not prove every fact. Other people's trees are hints; each statement has to be checked on its own.</div>`+(unique.map(citation).join('')||'<p class="muted">No sources yet.</p>')+`<h3>Source types in the tree</h3><div class="legend">${Object.entries(labels).map(([k,l])=>`<div><i style="background:${colors[k]}"></i>${l}</div>`).join('')}</div>`}
 $('#panel').innerHTML=`<div class="profile-head"><button class="close" data-close aria-label="Close profile">×</button>${av(p)}<h2>${esc(p.name)}</h2><div class="muted">${esc(years(p))}</div><div class="muted">${labels[p.cls]} · ${esc(id)}</div><button class="primary" data-root="${esc(id)}">Make root person in the tree</button></div><div class="tabs">${[['family','Family'],['life','Life events'],['media',`Media${p.media.length?' ('+p.media.length+')':''}`],['sources','Sources']].map(([k,l])=>`<button data-tab="${k}" class="${tab===k?'active':''}">${l}</button>`).join('')}</div><div class="content">${body}</div>`;document.querySelectorAll('.card').forEach(c=>c.classList.toggle('selected',c.dataset.person===id))}
function lightbox(mid){const m=ME[mid];if(!m||m.external)return;const src=BASE+m.file;$('#lightbox img').src=m.isImage?src:'';$('#lightbox img').style.display=m.isImage?'':'none';$('#lightbox .cap').innerHTML=`<b>${esc(m.title||m.file)}</b>${esc([m.date,m.place].filter(Boolean).join(' · '))}${m.description?'<br>'+esc(m.description):''}<br><a href="${esc(src)}" target="_blank" rel="noopener">Open file</a> · ${esc(m.file)}`;$('#lightbox').hidden=false}
function setMode(m,redraw=true){mode=m;document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===m);b.setAttribute('aria-pressed',b.dataset.mode===m)});$('#depth').disabled=m==='list';if(redraw){if(m==='tree')initOpen(depth);render();fit()}}
const normalize=s=>s.toLocaleLowerCase('de').normalize('NFD').replace(/[̀-ͯ]/g,''),searchText=p=>normalize([p.name,...p.names.map(n=>n.name),p.born,p.died,...p.events.map(e=>e.place)].join(' '));const index=Object.values(PE).map(p=>({p,text:searchText(p)}));
function results(value,filter=''){const words=normalize(value).trim().split(/\s+/);return index.filter(({p,text})=>(!filter||(filter==='withmedia'?p.media.some(x=>ME[x]&&!ME[x].external):p.cls===filter))&&words.every(w=>text.includes(w))).map(x=>x.p).sort((a,b)=>a.name.localeCompare(b.name,'en')||a.born.localeCompare(b.born))}
function renderDirectory(){$('#directory').hidden=false;$('#directory').innerHTML=`<div class="dir-head"><h2>All people</h2><input type="search" id="dir-search" aria-label="Filter people" placeholder="Name, place or year"><select id="filter" aria-label="Filter by source"><option value="">All source types</option>${Object.entries(labels).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}<option value="withmedia">With local documents</option></select></div><p id="count" class="muted"></p><div class="person-grid" id="grid"></div>`;updateDirectory()}
function updateDirectory(){const r=results($('#dir-search').value,$('#filter').value);$('#count').textContent=`${r.length} of ${Object.keys(PE).length} people`;$('#grid').innerHTML=r.map(p=>relative(p.id,labels[p.cls])).join('')||'<p class="empty">No matches. Change the search or filter.</p>'}
$('#search').addEventListener('input',()=>{const v=$('#search').value.trim();$('#hits').hidden=!v;if(!v)return;const r=results(v);$('#hits').innerHTML=r.slice(0,40).map(p=>`<button data-hit="${esc(p.id)}"><b>${esc(p.name)}</b><br><small>${esc(years(p))}</small></button>`).join('')||'<div class="empty">No person found.</div>'});
$('#search').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();$('#hits button')?.focus()}if(e.key==='Enter')$('#hits button')?.click()});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!e.target.closest('.search'))$('#hits').hidden=true;if(!b)return;
 if(b.dataset.act){const id=b.dataset.id;const set=b.dataset.act==='up'?openUp:b.dataset.act==='sib'?openSib:openDown;if(set.has(id))set.delete(id);else set.add(id);render();centerOn(id);return}
 if(b.dataset.lb){lightbox(b.dataset.lb);return}if(b.hasAttribute('data-lb-close')){$('#lightbox').hidden=true;return}
 if(b.dataset.mode)setMode(b.dataset.mode);if(b.dataset.person)show(b.dataset.person);if(b.dataset.go)show(b.dataset.go);if(b.dataset.hit){$('#hits').hidden=true;$('#search').value='';navigate(b.dataset.hit)}if(b.dataset.tab){tab=b.dataset.tab;show(selected)}if(b.dataset.root)navigate(b.dataset.root);if(b.hasAttribute('data-close')){$('#panel').hidden=true;fit()}});
$('#lightbox').addEventListener('click',e=>{if(e.target.id==='lightbox')$('#lightbox').hidden=true});
$('#nodes').addEventListener('dblclick',e=>{const b=e.target.closest('[data-person]');if(b)navigate(b.dataset.person)});
document.addEventListener('change',e=>{if(e.target.id==='parent-choice'){choices[selected]=e.target.value;show(selected);render();fit()}if(e.target.id==='filter')updateDirectory()});document.addEventListener('input',e=>{if(e.target.id==='dir-search')updateDirectory()});
$('#depth').onchange=e=>{depth=Number(e.target.value);if(mode==='tree')initOpen(depth);render();fit()};$('#home').onclick=()=>navigate(D.root);$('#back').onclick=()=>{if(history.length)navigate(history.pop(),false)};$('#plus').onclick=()=>zoom(1.25);$('#minus').onclick=()=>zoom(.8);$('#fit').onclick=fit;$('#zoom').onclick=()=>zoom(1/scale);$('#print').onclick=()=>window.print();
let drag=null;$('#stage').addEventListener('pointerdown',e=>{if(e.target.closest('button,input,select,#directory,#status'))return;drag={x:e.clientX,y:e.clientY,tx,ty};$('#stage').setPointerCapture(e.pointerId);$('#stage').classList.add('drag')});$('#stage').addEventListener('pointermove',e=>{if(!drag)return;tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;apply()});function release(){drag=null;$('#stage').classList.remove('drag')}$('#stage').addEventListener('pointerup',release);$('#stage').addEventListener('pointercancel',release);
$('#stage').addEventListener('wheel',e=>{if(e.target.closest('#directory'))return;e.preventDefault();const r=$('#stage').getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#lightbox').hidden){$('#lightbox').hidden=true;return}$('#hits').hidden=true;$('#panel').hidden=true;fit()}if(e.target.matches('input,select,textarea'))return;if(e.key==='/'){e.preventDefault();$('#search').focus()}if(e.key==='+'||e.key==='=')zoom(1.25);if(e.key==='-')zoom(.8)});
window.addEventListener('resize',fit);initOpen(depth);render();show(root);fit();
</script></body></html>
